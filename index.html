<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <h1></h1>
    <div class="app">
      <div class="msg"></div>
      <div class="area">
        <div class="inputs"></div>
        <div class="control">
          <button class="check">Check Word</button>
          <button class="hint"><span></span>Hints</button>
        </div>
      </div>
      <div class="colors-explain">
        <h2>Key Colors</h2>
        <div class="key-color">
          <div class="key in-place"></div>
          <div class="key-text">Letter Is Correct And In Place</div>
        </div>
        <div class="key-color">
          <div class="key not-in-place"></div>
          <div class="key-text">Letter Is Correct But Not In Place</div>
        </div>
        <div class="key-color">
          <div class="key wrong-guess"></div>
          <div class="key-text sec">Letter Is Wrong</div>
        </div>
      </div>
    </div>
    <footer></footer>
    <script src="js/main.js"></script>
  </body>
</html>
